services:
  - type: web
    name: ifsistem-auth
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # No Supabase use ifsistem_auth: o schema "auth" e reservado (ver README).
      - key: DB_SCHEMA
        sync: false
      - key: AUTH_ISSUER
        value: https://ifsistem-auth.onrender.com
      - key: AUTH_RSA_PRIVATE_KEY
        sync: false
      - key: AUTH_RSA_PUBLIC_KEY
        sync: false
      - key: PORTAL_URL
        sync: false
      - key: ADMIN_CPF
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75
