spring.application.name=ifsistem-auth
# 9000 em dev para nao colidir com os sistemas, que usam a 8080.
server.port=${PORT:9000}

# Mesmo banco do aproveitamento, em schema proprio.
auth.schema=${DB_SCHEMA:ifsistem_auth}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ifsystem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
# As consultas do JdbcOAuth2AuthorizationService nao qualificam o schema: ele vem da conexao.
spring.datasource.hikari.schema=${auth.schema}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${auth.schema}
spring.flyway.enabled=true
spring.flyway.schemas=${auth.schema}
spring.flyway.create-schemas=true
spring.flyway.default-schema=${auth.schema}

# Nome proprio: em localhost o cookie e compartilhado entre portas e colidiria com o JSESSIONID dos sistemas.
server.servlet.session.cookie.name=IFSISTEM_AUTH
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

auth.issuer=${AUTH_ISSUER:http://localhost:9000}
auth.portal-url=${PORTAL_URL:}
auth.rsa.private-key=${AUTH_RSA_PRIVATE_KEY:}
auth.rsa.public-key=${AUTH_RSA_PUBLIC_KEY:}
auth.rsa.obrigatoria=false

app.admin.cpf=${ADMIN_CPF:}
app.admin.senha=${ADMIN_SENHA:}
app.admin.email=${ADMIN_EMAIL:secretaria@ifsuldeminas.edu.br}

# Sistemas que usam o login (docs/INTEGRACAO.md). As URIs precisam ser identicas as usadas pelo sistema.
auth.clientes[0].client-id=aproveitamento
auth.clientes[0].redirect-uris=https://aproveitamento-ifsistem.onrender.com/callback.html,http://localhost:8080/callback.html
auth.clientes[0].post-logout-redirect-uris=https://aproveitamento-ifsistem.onrender.com/,http://localhost:8080/

# Pagina de exemplo servida pelo proprio auth.
auth.clientes[1].client-id=exemplo
auth.clientes[1].redirect-uris=${auth.issuer}/exemplo-cliente.html
auth.clientes[1].post-logout-redirect-uris=${auth.issuer}/exemplo-cliente.html

# Tela de gestao de usuarios da secretaria (usuarios.html, servida pelo proprio auth).
auth.clientes[2].client-id=auth-admin
auth.clientes[2].redirect-uris=${auth.issuer}/usuarios.html
auth.clientes[2].post-logout-redirect-uris=${auth.issuer}/usuarios.html

# Chaves (front no Vercel). As origens do CORS saem automaticamente destas redirect-uris.
auth.clientes[3].client-id=chaves
auth.clientes[3].redirect-uris=https://chaves-ifsistem.vercel.app/callback.html,http://localhost:5173/callback.html
auth.clientes[3].post-logout-redirect-uris=https://chaves-ifsistem.vercel.app/,http://localhost:5173/

# Menu unificado da tela de usuarios (GET /config). Icones: lista, livro, chave, pessoas. perfis vazio = todos.
# Override por env: APROVEITAMENTO_URL (base) ou AUTH_MENU_0_ITENS_0_URL etc. (relaxed binding).
auth.menu[0].titulo=Aproveitamento
auth.menu[0].itens[0].nome=Fila de solicita\u00e7\u00f5es
auth.menu[0].itens[0].icone=lista
auth.menu[0].itens[0].url=${APROVEITAMENTO_URL:https://aproveitamento-ifsistem.onrender.com}/aproveitamento.html#/
auth.menu[0].itens[0].perfis=SERVIDOR
auth.menu[0].itens[1].nome=Cursos e disciplinas
auth.menu[0].itens[1].icone=livro
auth.menu[0].itens[1].url=${APROVEITAMENTO_URL:https://aproveitamento-ifsistem.onrender.com}/aproveitamento.html#/cursos
auth.menu[0].itens[1].perfis=SERVIDOR
auth.menu[0].itens[2].nome=Coordenadores
auth.menu[0].itens[2].icone=chave
auth.menu[0].itens[2].url=${APROVEITAMENTO_URL:https://aproveitamento-ifsistem.onrender.com}/aproveitamento.html#/coordenadores
auth.menu[0].itens[2].perfis=SERVIDOR
auth.menu[1].titulo=\u00c1rea da secretaria
auth.menu[1].itens[0].nome=Usu\u00e1rios
auth.menu[1].itens[0].icone=pessoas
auth.menu[1].itens[0].url=/usuarios.html
auth.menu[1].itens[0].perfis=SERVIDOR
