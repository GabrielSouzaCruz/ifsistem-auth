<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta · IFSISTEM</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="sem-sessao">
<div class="layout">
    <div class="principal">
        <div class="{{avisoClasse}}" role="alert" {{avisoHidden}}>{{aviso}}</div>
        <main class="conteudo">
            <section class="login login-form">
                <img class="logo-completa" src="/img/logo-ifconect.png" alt="IF Conect" width="302" height="230">
                <p class="sobretitulo">Acesso único do IFSISTEM</p>

                <form class="card" method="post" action="/cadastro">
                    <input type="hidden" name="{{csrfNome}}" value="{{csrf}}">
                    <h1>Criar conta</h1>
                    <p class="muted pequeno">O cadastro é para alunos.</p>
                    <div class="campo"><label for="nome">Nome completo</label>
                        <input id="nome" name="nome" value="{{nome}}" autocomplete="name" maxlength="255" required></div>
                    <div class="campo"><label for="cpf">CPF</label>
                        <input id="cpf" name="cpf" value="{{cpf}}" data-mascara="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" maxlength="14" required></div>
                    <div class="campo"><label for="email">E-mail</label>
                        <input id="email" name="email" value="{{email}}" type="email" autocomplete="email" placeholder="nome@exemplo.com" maxlength="255" required></div>
                    <div class="campo"><label for="matricula">Matrícula</label>
                        <input id="matricula" name="matricula" value="{{matricula}}" maxlength="255" required></div>
                    <div class="campo"><label for="senha">Senha (mínimo 8 caracteres)</label>
                        <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></div>
                    <button type="submit" class="btn">Criar conta</button>
                    <p class="muted pequeno">Já tem conta? <a href="/login">Entrar</a></p>
                </form>
                <a class="voltar" href="{{portalUrl}}">← Portal IFSISTEM</a>
            </section>
        </main>
    </div>
</div>
<script src="/login.js"></script>
</body>
</html>
