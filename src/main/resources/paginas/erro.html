<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{titulo}} · IFSISTEM</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="sem-sessao">
<div class="layout">
    <div class="principal">
        <main class="conteudo">
            <section class="login">
                <img class="logo-completa" src="/img/logo-ifconect.png" alt="IF Conect" width="302" height="230">
                <p class="sobretitulo">Erro {{codigo}}</p>
                <div class="card">
                    <h1>{{titulo}}</h1>
                    <p>{{mensagem}}</p>
                    <a class="btn" href="{{portalUrl}}">Voltar ao Portal</a>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
