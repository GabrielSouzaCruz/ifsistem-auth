<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · IFSISTEM</title>
    <link rel="icon" type="image/png" href="/img/favicon.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="sem-sessao">
<div class="layout">
    <div class="principal">
        <div class="{{avisoClasse}}" role="alert" {{avisoHidden}}>{{aviso}}</div>
        <main class="conteudo">
            <section class="login login-form">
                <img class="logo-completa" src="/img/logo-ifconect.png" alt="IF Conect" width="302" height="230">
                <p class="sobretitulo">Acesso único do IFSISTEM</p>

                <form class="card" method="post" action="/login">
                    <input type="hidden" name="{{csrfNome}}" value="{{csrf}}">
                    <h1>Entrar</h1>
                    <div class="campo"><label for="cpf">CPF</label>
                        <input id="cpf" name="cpf" data-mascara="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" maxlength="14" required autofocus></div>
                    <div class="campo"><label for="senha">Senha</label>
                        <input id="senha" name="senha" type="password" autocomplete="current-password" required></div>
                    <button type="submit" class="btn">Entrar</button>
                    <p class="muted pequeno">Não tem conta? <a href="/cadastro">Criar conta</a></p>
                </form>
                <a class="voltar" href="{{portalUrl}}">← Portal IFSISTEM</a>
            </section>
        </main>
    </div>
</div>
<script src="/login.js"></script>
</body>
</html>
