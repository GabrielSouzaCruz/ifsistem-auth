# Profile de deploy no Render (Postgres externo: Supabase).
server.port=${PORT}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Session pooler do Supabase: limite de 15 conexoes somado entre todos os servicos.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=600000

# O Render termina o TLS no proxy.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true

# AUTH_ISSUER, AUTH_RSA_PRIVATE_KEY e AUTH_RSA_PUBLIC_KEY sao obrigatorias: vazias, a validacao impede a subida.
# (Sem o ":" o binder nao falharia: deixaria o texto do placeholder como valor.)
auth.issuer=${AUTH_ISSUER:}
auth.rsa.obrigatoria=true
