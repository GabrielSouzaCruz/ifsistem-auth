# Sobrepoe o application.properties principal nos testes e no spring-boot:test-run (H2 em modo PostgreSQL).
# As migracoes do Flyway e o ddl-auto=validate continuam ligados, como em producao.
spring.datasource.url=jdbc:h2:mem:ifsistemauth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS auth
spring.datasource.username=sa
spring.datasource.password=
auth.schema=auth
auth.issuer=http://localhost:9000
